<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parser Config Builder</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app" class="popup-container">
    <!-- Заголовок -->
    <header class="popup-header">
      <div class="popup-logo">
        <span class="popup-icon">🔧</span>
        <h1 class="popup-title">Parser Builder</h1>
      </div>
      <div class="popup-version">v1.0.0</div>
    </header>

    <!-- Основной контент -->
    <main class="popup-main">
      <!-- Информация о сайте -->
      <section class="site-info">
        <div class="site-info__row">
          <span class="site-info__label">Сайт:</span>
          <span class="site-info__value" id="site-domain">-</span>
        </div>
        <div class="site-info__row">
          <span class="site-info__label">Статус:</span>
          <span class="site-info__value" id="site-status">
            <span class="status-indicator status-indicator--inactive"></span>
            Неактивно
          </span>
        </div>
      </section>
      
      <!-- Расширенная информация -->
      <section class="extension-status" id="extension-status">
        <!-- Здесь будут статусные сообщения -->
      </section>
      
      <!-- Статистика -->
      <section class="stats-section" style="display: none;" id="stats-section">
        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-value" id="fields-count">0</div>
            <div class="stat-label">Полей</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="selectors-count">0</div>
            <div class="stat-label">Селекторов</div>
          </div>
        </div>
        
        <div class="status-indicators">
          <div id="sidebar-status" class="status-line">
            <span style="color: #999;">⚪ Sidebar неактивен</span>
          </div>
          <div id="selection-mode" class="status-line">
            <!-- Здесь будет индикатор режима выбора -->
          </div>
        </div>
      </section>

      <!-- Основные кнопки -->
      <section class="popup-actions">
        <button id="toggle-btn" class="btn btn--primary btn--large" disabled>
          <span class="btn-icon">🚀</span>
          Активировать
        </button>
        
        <button id="quick-select-btn" class="btn btn--secondary" disabled>
          <span class="btn-icon">🎯</span>
          Быстрый выбор
        </button>
      </section>
    </main>

    <!-- Подвал -->
    <footer class="popup-footer">
      <div class="footer-links">
        <button id="settings-btn" class="footer-link">
          <span class="footer-link__icon">⚙️</span>
          Настройки
        </button>
        
        <button id="help-btn" class="footer-link">
          <span class="footer-link__icon">❓</span>
          Помощь
        </button>
      </div>
    </footer>
    
    <!-- Лоадер -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Загрузка...</p>
    </div>
  </div>

  <!-- Важно: подключаем popup.ts (собранный в popup.js) -->
  <script type="module" src="popup.ts"></script>
</body>
</html>
